version: '3.8'

services:

  # ---------------------------------------------------------------
  # CleanTask API
  # ---------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cleantask-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DatabaseProvider=SqlServer
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=CleanTaskDb;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;
      - ConnectionStrings__PostgreSQLConnection=Host=postgres;Port=5432;Database=cleantaskdb;Username=postgres;Password=YourStrong@Password123;
      - JwtSettings__SecretKey=YourSuperSecretKeyThatIsAtLeast32CharactersLong!
      - JwtSettings__Issuer=CleanTaskAPI
      - JwtSettings__Audience=CleanTaskAPIUsers
    depends_on:
      sqlserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------
  # SQL Server
  # ---------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cleantask-sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Password123
      - MSSQL_PID=Express
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourStrong@Password123 -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------
  # PostgreSQL (switch DatabaseProvider to "PostgreSQL" to use)
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cleantask-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=cleantaskdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=YourStrong@Password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sqlserver_data:
  postgres_data:
